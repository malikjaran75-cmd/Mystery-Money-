<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Mystery Money Membership</title><style>
:root{--bg:#f5f6fa;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--gold:#d5a83b;--nav:#111827;--green:#15803d;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--nav);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:3}header b{font-size:19px}header small{color:#cbd5e1}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{background:linear-gradient(130deg,#101827,#26364e);color:white;border-radius:22px;padding:30px;margin:10px 0 22px}.hero h1{font-size:clamp(26px,5vw,42px);margin:0 0 8px}.hero p{color:#dbe3ef;max-width:680px;line-height:1.6}.btn,button{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer;background:#172033;color:white}.btn.gold{background:var(--gold);color:#201a0a}.btn.light{background:#eef0f4;color:#172033}.btn.red{background:#b91c1c}.btn.green{background:#15803d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 4px 15px #17203308}.plan{overflow:hidden;padding:0}.plan .top{padding:16px;color:white;font-weight:800;letter-spacing:.5px}.silver{background:linear-gradient(120deg,#64748b,#cbd5e1)}.gold{background:linear-gradient(120deg,#9a6a12,#e9c76d)}.platinum{background:linear-gradient(120deg,#263244,#8794a8)}.diamond{background:linear-gradient(120deg,#152238,#3c5779)}.plan .body{padding:17px}.price{font-size:30px;font-weight:850;margin:5px 0}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef2f7;font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#e8ebf1;color:#263244}.tabs button.active{background:#172033;color:white}input,select{width:100%;padding:12px;border:1px solid #cb </style></head><body><header><div><b>✦ MYSTERY MONEY</b><br><small>Membership • Shopping • Savings • 30 Days</small></div><button class="btn light" onclick="goHome()">Home</button></header><main class="wrap" id="app"></main><div class="foot">Mystery Money • Demo build • असली पेमेंट/OTP से पहले सुरक्षित सर्वर सेटअप जरूरी है</div><script>
const KEY='mm_upgrade_v1';const defaults={plans:[{name:'Silver',price:101,days:30,rate:15,cap:1000},{name:'Gold',price:251,days:30,rate:20,cap:2000},{name:'Platinum',price:501,days:30,rate:25,cap:5000},{name:'Diamond',price:1001,days:30,rate:30,cap:10000}],shops:[{id:'S001',name:'Sharma Fashion',category:'कपड़े',phone:'9999990001',status:'Approved',margin:35},{id:'S002',name:'Patel General Store',category:'जनरल स्टोर',phone:'9999990002',status:'Approved',margin:22},{id:'S003',name:'Fresh Kirana',category:'किराना',phone:'9999990003',status:'Approved',margin:18}],members:[],redemptions:[],offers:[{id:'O1',shop:'S001',title:'फैशन स्पेशल',min:1000,kind:'flat',value:250,max:250,plan:'All',active:true},{id:'O2',shop:'S002',title:'जनरल स्टोर बचत',min:1000,kind:'flat',value:150,max:150,plan:'All',active:true},{id:'O3',shop:'S003',title:'किराना ऑफर',min:5000,kind:'flat',value:500,max:1500,plan:'All',active:true}],commission:5};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){db=structuredClone(defaults)}// Demo test membership: reusable for testing only; browser-local demo data.
const DEMO_TEST_CODE='MMTEST101ABC';
const DEMO_TEST_PHONE='9999991234';
if(!db.members.some(m=>m.code===DEMO_TEST_CODE)){
  const now=Date.now();
  db.members.push({id:'M-DEMO-TEST',phone:DEMO_TEST_PHONE,plan:'Silver',price:101,created:now,expires:now+30*86400000,code:DEMO_TEST_CODE});
  localStorage.setItem(KEY,JSON.stringify(db));
}
let role='guest',user=null,tab='overview';function save(){localStorage.setItem(KEY,JSON.stringify(db))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function el(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function code(){return 'MM'+Math.random().toString(36).slice(2,8).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase()}function active(m){return m&&Date.now()<m.expires}function days(m){return Math.max(0,Math.ceil((m.expires-Date.now())/86400000))}function show(html){el('app').innerHTML=html}function goHome(){role='guest';user=null;home()}function home(){show(`<section class="hero"><span class="pill">आपकी खरीदारी, आपकी बचत</span><h1>हर पार्टनर दुकान पर<br>खास Membership Benefits</h1><p>एक मेंबरशिप कार्ड, अलग-अलग पार्टनर दुकानों के ऑफर। अपना प्लान चुनें, डिजिटल कार्ड पाएं और दुकान पर QR/कोड दिखाकर ऑफर रिडीम करें।</p><button class="btn gold" onclick="document.getElementById('plans').scrollIntoView({behavior:'smooth'})">प्लान देखें</button></section><h2>Membership Plans</h2><div class="grid" id="plans">${db.plans.map((p,i)=>`<article class="card plan"><div class="top ${['silver','gold','platinum','diamond'][i]}">${p.name.toUpperCase()} MEMBERSHIP</div><div class="body"><div class="price">${money(p.price)}</div><div class="muted">${p.days} दिन की वैधता</div><p><b>${p.rate}% तक</b> छूट • एक बिल पर अधिकतम ${money(p.cap)} की गणना सीमा</p><button class="btn" onclick="buy(${i})">यह प्लान लें</button></div></article>`).join('')}</div><h2 style="margin-top:28px">अपने डैशबोर्ड में जाएं</h2><div class="grid"><div class="card"><h3>ग्राहक</h3><p class="muted">अपना कार्ड, कोड और बची हुई वैधता देखें।</p><button onclick="login('customer')">Customer Login</button></div><div class="card"><h3>दुकानदार</h3><p class="muted">अपनी दुकान के कोड चेक करें और ऑफर रिडीम करें।</p><button onclick="login('shop')">Shopkeeper Login</button></div><div class="card"><h3>Owner Admin</h3><p class="muted">दुकानें, प्लान, ऑफर और रिपोर्ट मैनेज करें।</p><button onclick="login('admin')">Admin Demo Login</button></div></div><p class="notice" style="margin-top:18px">डेमो लॉगिन: ग्राहक के लिए कोई भी मोबाइल नंबर; दुकानदार के लिए 9999990001 / 9999990002 / 9999990003; Admin demo PIN: 1234. ये असली OTP या Google सुरक्षा नहीं हैं।</p>`)}function buy(i){const p=db.plans[i];const phone=prompt('अपना 10 अंकों का मोबाइल नंबर डालें (डेमो):');if(!phone||!/^\d{10}$/.test(phone)){alert('सही 10 अंकों का नंबर डालें');return}let m=db.members.find(x=>x.phone===phone&&active(x));if(m){alert('इस नंबर पर पहले से एक एक्टिव मेंबरशिप है। Customer Login करें।');return}m={id:'M'+Date.now(),phone,plan:p.name,price:p.price,created:Date.now(),expires:Date.now()+p.days*86400000,code:code()};db.members.push(m);save();alert('डेमो मेंबरशिप बन गई! आपका कोड: '+m.code);role='customer';user=phone;customer()}function login(r){role=r;let hint=r==='shop'?'मोबाइल नंबर':r==='customer'?'मोबाइल नंबर':'Admin PIN';let v=prompt(hint+' डालें:');if(v===null)return;if(r==='admin'){if(v!=='1234'){alert('डेमो PIN 1234 है');return}user='owner';admin();return}if(r==='shop'){let s=db.shops.find(x=>x.phone===v);if(!s){alert('यह दुकान रजिस्टर्ड नहीं है');return}user=s.id;shop()}else{if(!/^\d{10}$/.test(v)){alert('10 अंकों का नंबर डालें');return}user=v;customer()}}function customer(){let ms=db.members.filter(m=>m.phone===user).sort((a,b)=>b.created-a.created);show(`<h2>Customer Dashboard</h2><p class="muted">मोबाइल: ${esc(user)} <button class="btn light" onclick="goHome()">Logout</button></p>${ms.length?ms.map(m=>`<section class="membership"><div style="display:flex;justify-content:space-between"><b>MYSTERY MONEY</b><span>${esc(m.plan.toUpperCase())}</span></div><div class="code">${esc(m.code)}</div><div>MEMBER: ${esc(m.phone)}</div><div style="display:flex;justify-content:space-between;margin-top:18px"><span>वैधता: ${days(m)} दिन बाकी</span><span>${active(m)?'ACTIVE':'EXPIRED'}</span></div><small>शुरू: ${new Date(m.created).toLocaleDateString('hi-IN')} • समाप्त: ${new Date(m.expires).toLocaleDateString('hi-IN')}</small></section>`).join(''):`<div class="panel">अभी कोई मेंबरशिप नहीं है। <button onclick="home()">प्लान खरीदें</button></div>`}<h3 style="margin-top:24px">पार्टनर दुकानें और ऑफर</h3><div class="grid">${db.shops.filter(s=>s.status==='Approved').map(s=>{let o=db.offers.filter(o=>o.shop===s.id&&o.active);return `<div class="card offer"><b>${esc(s.name)}</b><div class="muted">${esc(s.category)}</div>${o.map(x=>`<p>${esc(x.title)}<br><b>${x.kind==='flat'?money(x.value)+' तक बचत':x.value+'% छूट'}</b><br><small>${x.plan&&x.plan!=='All'?esc(x.plan)+' के लिए':'सभी मेंबरशिप'} • न्यूनतम खरीद ${money(x.min)}</small></p>`).join('')}</div>`}).join('')}</div>`)}function shop(){let s=db.shops.find(x=>x.id===user);show(`<h2>${esc(s.name)} — Shop Dashboard</h2><p class="muted">${esc(s.category)} • ${s.phone} <button class="btn light" onclick="goHome()">Logout</button></p><div class="grid"><div class="statbox"><div class="stat">${db.redemptions.filter(r=>r.shop===s.id).length}</div><small>कुल रिडेम्पशन</small></div><div class="statbox"><div class="stat">${money(db.redemptions.filter(r=>r.shop===s.id).reduce((a,r)=>a+r.bill,0))}</div><small>कुल दर्ज बिक्री</small></div><div class="statbox"><div class="stat">${money(db.redemptions.filter(r=>r.shop===s.id).reduce((a,r)=>a+r.discount,0))}</div><small>ग्राहक को छूट</small></div></div><div class="panel" style="margin-top:16px"><h3>Membership Code Verify / Redeem</h3><label>ग्राहक का कार्ड कोड</label><input id="redeemCode" placeholder="जैसे MMABC123XYZ"><label>बिल की कुल रकम (₹)</label><input id="bill" type="number" min="1" placeholder="1000"><button class="btn green" onclick="checkRedeem('${s.id}')">ऑफर चेक करें</button><div id="result" style="margin-top:12px"></div></div><div class="panel" style="margin-top:16px"><h3>मेरे ऑफर</h3>${db.offers.filter(o=>o.shop===s.id).map(o=>`<p><b>${esc(o.title)}</b> — न्यूनतम ${money(o.min)} • ${o.kind==='flat'?money(o.value):o.value+'%'} ${o.active?'🟢 चालू':'🔴 बंद'}</p>`).join('')||'कोई ऑफर नहीं'}</div><div class="panel" style="margin-top:16px"><h3>Recent Sales</h3>${table(db.redemptions.filter(r=>r.shop===s.id).slice().reverse().slice(0,20),['तारीख','कोड','बिल','छूट','नेट'])}</div>`)}function checkRedeem(sid){let c=el('redeemCode').value.trim().toUpperCase(),bill=Number(el('bill').value),m=db.members.find(x=>x.code===c),s=db.shops.find(x=>x.id===sid),out=el('result');if(!m){out.innerHTML='<span class="bad">यह कोड नहीं मिला।</span>';return}if(!active(m)){out.innerHTML='<span class="bad">मेंबरशिप एक्सपायर हो चुकी है।</span>';return}if(!bill||bill<=0){out.innerHTML='<span class="bad">बिल की रकम सही डालें।</span>';return}let offer=db.offers.find(o=>o.shop===sid&&o.active&&bill>=o.min&&(!o.plan||o.plan==='All'||o.plan===m.plan));if(!offer){out.innerHTML='<span class="bad">इस बिल पर कोई सक्रिय ऑफर लागू नहीं है।</span>';return}let tier=db.plans.find(p=>p.name===m.plan),shopDiscount=offer.kind==='flat'?Math.min(offer.value,offer.max||offer.value):Math.min(bill*offer.value/100,offer.max||Infinity),tierDiscount=Math.min(bill*tier.rate/100,tier.cap*tier.rate/100),discount=Math.max(0,Math.round(Math.min(shopDiscount,tierDiscount,bill)));let net=bill-discount;out.innerHTML=`<div class="notice"><b>कोड मान्य है ✓</b><br>ग्राहक: ${esc(m.phone)} • ${esc(m.plan)}<br>ऑफर: ${esc(offer.title)}<br>बिल: ${money(bill)}<br>मेंबरशिप लाभ: ${tier.rate}% तक • दुकान ऑफर और प्लान दोनों लागू<br>छूट: <b>${money(discount)}</b><br>ग्राहक से लें: <b>${money(net)}</b></div><button class="btn green" style="margin-top:10px" onclick="confirmRedeem('${sid}','${c}',${bill},${discount})">Confirm & Redeem</button>`}function confirmRedeem(sid,c,bill,discount){db.redemptions.push({id:'R'+Date.now(),shop:sid,code:c,bill,discount,net:bill-discount,commission:Math.round((bill-discount)*db.commission)/100,at:Date.now()});save();alert('रिडेम्पशन सफल!');shop()}function table(rows,heads){if(!rows.length)return '<p class="muted">अभी कोई रिकॉर्ड नहीं है।</p>';return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function admin(){let sales=db.redemptions;show(`<h2>Owner Admin Dashboard</h2><p class="muted">Owner Control Center <button class="btn light" onclick="goHome()">Logout</button></p><div class="grid"><div class="statbox"><div class="stat">${db.members.length}</div><small>कुल मेंबरशिप</small></div><div class="statbox"><div class="stat">${db.shops.length}</div><small>कुल दुकानें</small></div><div class="statbox"><div class="stat">${money(sales.reduce((a,r)=>a+r.commission,0))}</div><small>अनुमानित प्लेटफॉर्म कमीशन</small></div><div class="statbox"><div class="stat">${money(sales.reduce((a,r)=>a+r.discount,0))}</div><small>कुल ग्राहक छूट</small></div></div><div class="tabs"><button class="${tab==='overview'?'active':''}" onclick="tab='overview';admin()">Overview</button><button class="${tab==='plans'?'active':''}" onclick="tab='plans';admin()">Plans</button><button class="${tab==='shops'?'active':''}" onclick="tab='shops';admin()">Shops</button><button class="${tab==='offers'?'active':''}" onclick="tab='offers';admin()">Offers</button><button class="${tab==='members'?'active':''}" onclick="tab='members';admin()">Members & Reports</button></div><div class="panel">${tab==='overview'?`<h3>Business Snapshot</h3><p>सभी दुकानों के रिडेम्पशन: ${sales.length}</p><p>दर्ज कुल बिक्री: ${money(sales.reduce((a,r)=>a+r.bill,0))}</p><p>दुकानदारों को ग्राहक छूट: ${money(sales.reduce((a,r)=>a+r.discount,0))}</p><p>आपका कमीशन: ${db.commission}% (डेमो कैलकुलेशन)</p><div class="notice">महत्वपूर्ण: कमीशन/प्रॉफिट को वास्तविक अकाउंटिंग मानने से पहले दुकान के वास्तविक खरीद मूल्य, GST, रिटर्न और सेटलमेंट नियम जोड़ने होंगे।</div>`:tab==='plans'?`<h3>Membership Plans Edit</h3>${db.plans.map((p,i)=>`<div class="row"><div><label>${p.name} Price</label><input id="p${i}" type="number" value="${p.price}"></div><div><label>Validity Days</label><input id="d${i}" type="number" value="${p.days}"></div><div><label>Discount %</label><input id="r${i}" type="number" value="${p.rate}"></div><div><label>Bill cap ₹</label><input id="c${i}" type="number" value="${p.cap}"></div></div>`).join('')}<button onclick="savePlans()">Save Plans</button>`:tab==='shops'?`<h3>Partner Shops</h3>${table(db.shops.map(s=>[esc(s.name),esc(s.category),s.phone,s.status]),['दुकान','कैटेगरी','मोबाइल','स्टेटस'])}<hr><h3>नई दुकान जोड़ें</h3><label>दुकान का नाम</label><input id="sn"><label>कैटेगरी</label><input id="sc" placeholder="किराना / कपड़े / जनरल"><label>दुकानदार मोबाइल</label><input id="sp" maxlength="10"><button onclick="addShop()">Add Shop</button>`:tab==='offers'?`<h3>Store-specific Offers</h3>${db.offers.map(o=>`<p><b>${esc(db.shops.find(s=>s.id===o.shop)?.name||'')}</b> — ${esc(o.title)} • Min ${money(o.min)} • ${o.kind==='flat'?money(o.value):o.value+'%'} • ${o.plan&&o.plan!=='All'?o.plan:'All Plans'} • ${o.active?'Active':'Paused'}</p>`).join('')}<hr><h3>नया ऑफर बनाएं</h3><label>दुकान</label><select id="os">${db.shops.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>ऑफर नाम</label><input id="ot"><label>किस मेंबरशिप के लिए?</label><select id="oplan"><option>All</option>${db.plans.map(p=>`<option>${p.name}</option>`).join('')}</select><div class="row"><div><label>Minimum Bill ₹</label><input id="om" type="number" value="1000"></div><div><label>Discount ₹ (fixed)</label><input id="ov" type="number" value="150"></div><div><label>Maximum Discount ₹</label><input id="ox" type="number" value="250"></div></div><button onclick="addOffer()">Create Offer</button>`:`<h3>Memberships</h3>${table(db.members.map(m=>[m.phone,m.plan,m.code,active(m)?days(m)+' दिन':'Expired']),['ग्राहक','प्लान','कार्ड कोड','वैधता'])}<h3 style="margin-top:24px">Redemption Ledger</h3>${table(sales.map(r=>[new Date(r.at).toLocaleDateString('hi-IN'),r.shop,r.code,money(r.bill),money(r.discount),money(r.commission)]),['तारीख','Shop ID','कोड','बिल','छूट','कमीशन'])}<button class="btn light" onclick="exportCSV()">Download CSV Report</button>`}</div>`)}function savePlans(){db.plans.forEach((p,i)=>{p.price=+el('p'+i).value;p.days=+el('d'+i).value;p.rate=+el('r'+i).value;p.cap=+el('c'+i).value});save();alert('Plans saved');admin()}function addShop(){let name=el('sn').value.trim(),category=el('sc').value.trim(),phone=el('sp').value.trim();if(!name||!category||!/^[0-9]{10}$/.test(phone)){alert('सभी जानकारी सही भरें');return}if(db.shops.some(s=>s.phone===phone)){alert('यह मोबाइल पहले से मौजूद है');return}db.shops.push({id:'S'+Date.now(),name,category,phone,status:'Approved',margin:20});save();admin()}function addOffer(){let shop=el('os').value,title=el('ot').value.trim(),min=+el('om').value,value=+el('ov').value,max=+el('ox').value;if(!title||min<=0||value<=0){alert('ऑफर की जानकारी भरें');return}db.offers.push({id:'O'+Date.now(),shop,title,min,kind:'flat',value,max,plan:el('oplan').value,active:true});save();alert('Offer created');admin()}function exportCSV(){let lines=[['Date','Shop','Code','Bill','Discount','Net','Commission'],...db.redemptions.map(r=>[new Date(r.at).toISOString(),r.shop,r.code,r.bill,r.discount,r.net,r.commission])];let csv=lines.map(a=>a.join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mystery-money-redemptions.csv';a.click();URL.revokeObjectURL(a.href)}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></main></body></html>
